<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Vuelto · Me Mata Limón</title>
  <meta name="theme-color" content="#a88cd7" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
<style>
    body { background: linear-gradient(160deg, #f8f5fc 0%, #efe8f8 50%, #f5f0fa 100%); min-height: 100vh; }
    
  </style>
  <link rel="stylesheet" href="tw.css" />
</head>
<body class="font-sans text-ink antialiased">
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-primary/15 shadow-sm">
    <div class="max-w-lg mx-auto px-4 py-3 flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-gradient-to-br from-primary to-primary-dark flex items-center justify-center text-white text-sm shadow-soft">💵</div>
      <div>
        <h1 class="font-display text-lg text-primary-dark font-bold leading-tight">Contador de vuelto</h1>
        <p class="text-[11px] text-gray-500">Total · pago · cambio</p>
      </div>
    </div>
  </header>
  <main class="max-w-lg mx-auto px-4 py-5 pb-16 space-y-4">

    <section class="bg-white rounded-2xl shadow-card border border-primary/10 p-4 space-y-3">
      <h2 class="text-sm font-semibold text-primary-dark">1. Total a cobrar</h2>
      <input type="number" id="total" inputmode="decimal" step="0.01" min="0" placeholder="0" class="w-full rounded-xl border border-gray-200 px-4 py-3 text-2xl font-semibold text-center" />
    </section>
    <section class="bg-white rounded-2xl shadow-card border border-primary/10 p-4 space-y-3">
      <h2 class="text-sm font-semibold text-primary-dark">2. Con cuánto paga</h2>
      <input type="number" id="pago" inputmode="decimal" step="0.01" min="0" placeholder="0" class="w-full rounded-xl border border-gray-200 px-4 py-3 text-2xl font-semibold text-center" />
      <div class="flex flex-wrap gap-2">
        <button type="button" data-bill="1000" class="bill px-3 py-1.5 rounded-lg bg-primary-soft text-primary-dark text-xs font-semibold">$1.000</button>
        <button type="button" data-bill="2000" class="bill px-3 py-1.5 rounded-lg bg-primary-soft text-primary-dark text-xs font-semibold">$2.000</button>
        <button type="button" data-bill="5000" class="bill px-3 py-1.5 rounded-lg bg-primary-soft text-primary-dark text-xs font-semibold">$5.000</button>
        <button type="button" data-bill="10000" class="bill px-3 py-1.5 rounded-lg bg-primary-soft text-primary-dark text-xs font-semibold">$10.000</button>
        <button type="button" data-bill="20000" class="bill px-3 py-1.5 rounded-lg bg-primary-soft text-primary-dark text-xs font-semibold">$20.000</button>
        <button type="button" data-bill="50000" class="bill px-3 py-1.5 rounded-lg bg-primary-soft text-primary-dark text-xs font-semibold">$50.000</button>
      </div>
    </section>
    <section class="bg-white rounded-2xl shadow-card border border-primary/10 p-5 text-center">
      <p class="text-xs text-gray-500 uppercase tracking-wide">Vuelto</p>
      <p id="vuelto" class="text-4xl font-bold text-primary-dark mt-1">$0</p>
      <p id="msg" class="text-sm text-gray-500 mt-2"></p>
    </section>
    <button type="button" id="btn-clear" class="w-full py-2.5 rounded-xl border border-primary/30 text-sm font-semibold text-primary-dark">Limpiar</button>

  </main>
  <script src="app.js"></script>
</body>
</html>
