<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Cuotas y recargo · Me Mata Limón</title>
  <meta name="theme-color" content="#a88cd7" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
<style>
    body { background: linear-gradient(160deg, #f8f5fc 0%, #efe8f8 50%, #f5f0fa 100%); min-height: 100vh; }
    
  </style>
  <link rel="stylesheet" href="tw.css" />
</head>
<body class="font-sans text-ink antialiased">
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-primary/15 shadow-sm">
    <div class="max-w-lg mx-auto px-4 py-3 flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-gradient-to-br from-primary to-primary-dark flex items-center justify-center text-white text-sm shadow-soft">💳</div>
      <div>
        <h1 class="font-display text-lg text-primary-dark font-bold leading-tight">Cuotas y recargo</h1>
        <p class="text-[11px] text-gray-500">Precio · cuotas · interés</p>
      </div>
    </div>
  </header>
  <main class="max-w-lg mx-auto px-4 py-5 pb-16 space-y-4">

    <section class="bg-white rounded-2xl shadow-card border border-primary/10 p-4 space-y-3">
      <h2 class="text-sm font-semibold text-primary-dark">1. Precio de contado / transferencia</h2>
      <input type="number" id="precio" inputmode="decimal" step="0.01" min="0" placeholder="0" class="w-full rounded-xl border border-gray-200 px-4 py-3 text-xl font-semibold text-center" />
    </section>
    <section class="bg-white rounded-2xl shadow-card border border-primary/10 p-4 space-y-3">
      <h2 class="text-sm font-semibold text-primary-dark">2. Recargo total (%)</h2>
      <input type="number" id="recargo" inputmode="decimal" step="0.1" min="0" value="0" class="w-full rounded-xl border border-gray-200 px-4 py-2 text-lg text-center" />
      <div class="flex flex-wrap gap-2">
        <button type="button" data-r="0" class="rbtn px-3 py-1.5 rounded-lg bg-primary-soft text-primary-dark text-xs font-semibold">0%</button>
        <button type="button" data-r="10" class="rbtn px-3 py-1.5 rounded-lg bg-primary-soft text-primary-dark text-xs font-semibold">10%</button>
        <button type="button" data-r="15" class="rbtn px-3 py-1.5 rounded-lg bg-primary-soft text-primary-dark text-xs font-semibold">15%</button>
        <button type="button" data-r="20" class="rbtn px-3 py-1.5 rounded-lg bg-primary-soft text-primary-dark text-xs font-semibold">20%</button>
        <button type="button" data-r="25" class="rbtn px-3 py-1.5 rounded-lg bg-primary-soft text-primary-dark text-xs font-semibold">25%</button>
        <button type="button" data-r="30" class="rbtn px-3 py-1.5 rounded-lg bg-primary-soft text-primary-dark text-xs font-semibold">30%</button>
      </div>
      <p class="text-[11px] text-gray-400">El % se aplica sobre el precio de contado (recargo total del plan, no mensual).</p>
    </section>
    <section class="bg-white rounded-2xl shadow-card border border-primary/10 p-4 space-y-3">
      <h2 class="text-sm font-semibold text-primary-dark">3. Cantidad de cuotas</h2>
      <input type="number" id="ncuotas" inputmode="numeric" min="1" max="48" value="3" class="w-full rounded-xl border border-gray-200 px-4 py-2 text-lg text-center" />
      <div class="flex flex-wrap gap-2">
        <button type="button" data-c="1" class="cbtn px-3 py-1.5 rounded-lg bg-primary-soft text-primary-dark text-xs font-semibold">1</button>
        <button type="button" data-c="3" class="cbtn px-3 py-1.5 rounded-lg bg-primary-soft text-primary-dark text-xs font-semibold">3</button>
        <button type="button" data-c="6" class="cbtn px-3 py-1.5 rounded-lg bg-primary-soft text-primary-dark text-xs font-semibold">6</button>
        <button type="button" data-c="9" class="cbtn px-3 py-1.5 rounded-lg bg-primary-soft text-primary-dark text-xs font-semibold">9</button>
        <button type="button" data-c="12" class="cbtn px-3 py-1.5 rounded-lg bg-primary-soft text-primary-dark text-xs font-semibold">12</button>
      </div>
    </section>
    <section class="bg-white rounded-2xl shadow-card border border-primary/10 p-4 space-y-2">
      <div class="flex justify-between text-sm"><span class="text-gray-500">Precio final</span><span id="final" class="font-bold text-primary-dark">$0</span></div>
      <div class="flex justify-between text-sm"><span class="text-gray-500">Valor de cada cuota</span><span id="cuota" class="font-bold text-primary-dark">$0</span></div>
      <div class="flex justify-between text-sm"><span class="text-gray-500">Recargo en $</span><span id="recargoPesos" class="font-semibold">$0</span></div>
      <p id="resumen" class="text-xs text-gray-500 pt-2 border-t border-primary/10"></p>
    </section>

  </main>
  <script src="app.js"></script>
</body>
</html>
