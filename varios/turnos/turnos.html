<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Turnos del día · Me Mata Limón</title>
  <meta name="theme-color" content="#a88cd7" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
<style>
    body { background: linear-gradient(160deg, #f8f5fc 0%, #efe8f8 50%, #f5f0fa 100%); min-height: 100vh; }
    .turno-ok { background: #e8f8ef !important; border-color: #86d4a8 !important; }
    .turno-pasado { background: #fff7ed !important; border-color: #fdba74 !important; }
    .turno-ok .hora { color: #15803d; }
  </style>
  <link rel="stylesheet" href="tw.css" />
</head>
<body class="font-sans text-ink antialiased">
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-primary/15 shadow-sm">
    <div class="max-w-lg mx-auto px-4 py-3 flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-gradient-to-br from-primary to-primary-dark flex items-center justify-center text-white text-sm shadow-soft">🗓️</div>
      <div>
        <h1 class="font-display text-lg text-primary-dark font-bold leading-tight">Turnos del día</h1>
        <p class="text-[11px] text-gray-500">Checklist · se guarda en el dispositivo</p>
      </div>
    </div>
  </header>
  <main class="max-w-lg mx-auto px-4 py-5 pb-16 space-y-4">

    <section class="bg-white rounded-2xl shadow-card border border-primary/10 p-4 space-y-3">
      <h2 class="text-sm font-semibold text-primary-dark">Fecha</h2>
      <input type="date" id="fecha" class="w-full rounded-xl border border-gray-200 px-3 py-2 text-sm" />
      <p class="text-[11px] text-gray-400">Marcá el casillero cuando el turno esté cumplido (queda en verde). Si pasó la hora y no lo marcaste, se destaca en naranja.</p>
    </section>

    <section class="bg-white rounded-2xl shadow-card border border-primary/10 p-4 space-y-3">
      <h2 class="text-sm font-semibold text-primary-dark">Agregar turno</h2>
      <div class="grid grid-cols-3 gap-2">
        <input type="time" id="hora" class="col-span-1 rounded-xl border border-gray-200 px-2 py-2 text-sm" />
        <input type="text" id="nombre" placeholder="Nombre / detalle" class="col-span-2 rounded-xl border border-gray-200 px-3 py-2 text-sm" />
      </div>
      <button type="button" id="btn-add" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-primary to-primary-dark text-white font-semibold text-sm shadow-soft">Agregar</button>
    </section>

    <section class="bg-white rounded-2xl shadow-card border border-primary/10 p-4 space-y-2">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-primary-dark">Agenda</h2>
        <button type="button" id="btn-clear-day" class="text-[11px] text-red-500">Vaciar día</button>
      </div>
      <ul id="lista" class="space-y-2"></ul>
      <p id="empty" class="text-sm text-gray-400 text-center py-4">Sin turnos para este día.</p>
    </section>

  </main>
  <script src="app.js"></script>
</body>
</html>
