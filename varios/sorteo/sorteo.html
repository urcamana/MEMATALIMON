<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sorteo y rifa · Me Mata Limón</title>
  <meta name="theme-color" content="#a88cd7" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#a88cd7', dark: '#8e66cf', soft: '#f3eef9' },
            ink: '#2d2a33'
          },
          fontFamily: { sans: ['Inter','system-ui','sans-serif'], display: ['Playfair Display','serif'] },
          boxShadow: { soft: '0 4px 20px rgba(168,140,215,.18)', card: '0 8px 28px rgba(115,90,160,.12)' }
        }
      }
    }
  </script>
  <style>
    body { background: linear-gradient(160deg, #f8f5fc 0%, #efe8f8 50%, #f5f0fa 100%); min-height: 100vh; }
    .mode.active { border-color: #8e66cf; background: #f3eef9; box-shadow: 0 0 0 2px rgba(142,102,207,.22); }
    #wheel { transition: transform 4s cubic-bezier(0.12, 0.75, 0.05, 1); }
  </style>
</head>
<body class="font-sans text-ink antialiased">
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-primary/15 shadow-sm">
    <div class="max-w-lg mx-auto px-4 py-3 flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-gradient-to-br from-primary to-primary-dark flex items-center justify-center text-white text-sm shadow-soft">🎲</div>
      <div>
        <h1 class="font-display text-lg text-primary-dark font-bold leading-tight">Sorteo y rifa</h1>
        <p class="text-[11px] text-gray-500">Números · nombres · grilla · ruleta</p>
      </div>
    </div>
  </header>

  <main class="max-w-lg mx-auto px-4 py-5 pb-16 space-y-4">
    <section class="bg-white rounded-2xl shadow-card border border-primary/10 p-4 space-y-3">
      <h2 class="text-sm font-semibold text-primary-dark">1. ¿Qué sorteás?</h2>
      <div class="grid grid-cols-2 gap-2">
        <button type="button" class="mode active rounded-xl border-2 border-primary/30 p-3 text-left" data-mode="numeros">
          <div class="font-bold text-sm text-primary-dark">Números</div>
          <div class="text-[10px] text-gray-500">Rifa 1…N</div>
        </button>
        <button type="button" class="mode rounded-xl border border-primary/15 p-3 text-left" data-mode="nombres">
          <div class="font-bold text-sm">Nombres</div>
          <div class="text-[10px] text-gray-500">Lista de participantes</div>
        </button>
      </div>
    </section>

    <section id="cfg-num" class="bg-white rounded-2xl shadow-card border border-primary/10 p-4 space-y-3">
      <h2 class="text-sm font-semibold text-primary-dark">2. Rango de números</h2>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-[11px] text-gray-500">Desde</label>
          <input type="number" id="n-from" value="1" min="0" class="w-full rounded-xl border border-gray-200 px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="text-[11px] text-gray-500">Hasta</label>
          <input type="number" id="n-to" value="50" min="1" class="w-full rounded-xl border border-gray-200 px-3 py-2 text-sm" />
        </div>
      </div>
    </section>

    <section id="cfg-names" class="bg-white rounded-2xl shadow-card border border-primary/10 p-4 space-y-3 hidden">
      <h2 class="text-sm font-semibold text-primary-dark">2. Nombres (uno por línea)</h2>
      <textarea id="names" rows="6" placeholder="Ana&#10;Bruno&#10;Carla&#10;Diego" class="w-full rounded-xl border border-gray-200 px-3 py-2 text-sm"></textarea>
      <p id="name-count" class="text-xs text-gray-400">0 nombres</p>
    </section>

    <section class="bg-white rounded-2xl shadow-card border border-primary/10 p-4 space-y-3">
      <h2 class="text-sm font-semibold text-primary-dark">3. Acción</h2>
      <div class="grid grid-cols-1 gap-2">
        <button type="button" id="btn-draw" class="w-full py-3 rounded-xl bg-gradient-to-r from-primary to-primary-dark text-white font-semibold shadow-soft">Sortear un ganador</button>
        <button type="button" id="btn-spin" class="w-full py-3 rounded-xl border border-primary/30 font-semibold text-primary-dark">Girar ruleta</button>
        <button type="button" id="btn-pdf" class="w-full py-3 rounded-xl border border-primary/30 font-semibold text-primary-dark">PDF grilla para rifa (A4)</button>
      </div>
      <div id="result" class="hidden text-center p-4 rounded-xl bg-primary-soft/60 border border-primary/15">
        <p class="text-xs text-gray-500 uppercase tracking-wide">Ganador</p>
        <p id="winner" class="text-2xl font-bold text-primary-dark mt-1"></p>
      </div>
    </section>

    <section class="bg-white rounded-2xl shadow-card border border-primary/10 p-4 space-y-3">
      <h2 class="text-sm font-semibold text-primary-dark">Ruleta</h2>
      <div class="relative mx-auto w-64 h-64 sm:w-72 sm:h-72">
        <div class="absolute left-1/2 -top-1 -translate-x-1/2 z-10 text-primary-dark text-2xl">▼</div>
        <canvas id="wheel" width="320" height="320" class="w-full h-full rounded-full shadow-card"></canvas>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
